<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التقارير — نظام المخبز</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="reports.css">
</head>
<body>

<div class="topbar">
  <h1>📊 التقارير والمبيعات</h1>
  <div style="display:flex; gap:10px;">
    <a href="cashier.html" class="btn btn-ghost">🧾 الكاشير</a>
    <a href="admin.html" class="btn btn-ghost">⚙️ المنتجات</a>
  </div>
</div>

<div class="reports-wrap">

  <div class="period-bar">
    <button class="period-btn active" data-period="day">اليوم</button>
    <button class="period-btn" data-period="week">الأسبوع</button>
    <button class="period-btn" data-period="month">الشهر</button>
    <button class="period-btn" data-period="year">السنة</button>
    <input type="date" id="dateInput">
  </div>

  <div class="summary-cards">
    <div class="summary-card">
      <div class="sc-label">عدد الطلبيات</div>
      <div class="sc-value" id="ordersCount">0</div>
    </div>
    <div class="summary-card highlight">
      <div class="sc-label">إجمالي المبيعات</div>
      <div class="sc-value" id="revenue">0.00 ₪</div>
    </div>
    <div class="summary-card">
      <div class="sc-label">متوسط الطلبية</div>
      <div class="sc-value" id="avgOrder">0.00 ₪</div>
    </div>
  </div>

  <div class="grid-2">
    <div class="card">
      <h2>المبيعات حسب الفئة</h2>
      <div id="categoryList"></div>
    </div>
    <div class="card">
      <h2>الأصناف الأكثر مبيعاً</h2>
      <div id="productList"></div>
    </div>
  </div>

  <div class="card">
    <h2>المبيعات حسب اليوم</h2>
    <div id="dayChart" class="day-chart"></div>
  </div>

</div>

<script src="reports.js"></script>
</body>
</html>
