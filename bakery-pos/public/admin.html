<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة المنتجات — نظام المخبز</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="topbar">
  <h1>⚙️ إدارة المنتجات والأسعار</h1>
  <div style="display:flex; gap:10px;">
    <a href="cashier.html" class="btn btn-ghost">🧾 الكاشير</a>
    <a href="reports.html" class="btn btn-ghost">📊 التقارير</a>
  </div>
</div>

<div class="admin-wrap">

  <div class="add-form card">
    <h2>إضافة صنف جديد</h2>
    <div class="form-row">
      <input type="text" id="newIcon" placeholder="🥐" maxlength="4" class="icon-input">
      <input type="text" id="newName" placeholder="اسم الصنف">
      <select id="newCategory">
        <option value="pastry">معجنات</option>
        <option value="bread">خبز</option>
      </select>
      <input type="number" id="newPrice" placeholder="السعر" step="0.25" min="0">
      <button class="btn btn-primary" id="addBtn">إضافة</button>
    </div>
  </div>

  <div class="card">
    <h2>الأصناف الحالية</h2>
    <table class="prod-table">
      <thead>
        <tr><th>الأيقونة</th><th>الاسم</th><th>الفئة</th><th>السعر (₪)</th><th>الحالة</th><th></th></tr>
      </thead>
      <tbody id="prodTableBody"></tbody>
    </table>
  </div>

</div>

<div class="toast-wrap" id="toastWrap"></div>

<script src="admin.js"></script>
</body>
</html>
